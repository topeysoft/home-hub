# The brain, with the panel built in, as one image for both kinds of hub host: amd64 (a NUC, any
# Linux box, a VM) and arm64 (Pi 5). install.sh pulls it and only builds locally when the pull fails.
#
# What each tag means, because a hub chooses between them:
#   latest, X.Y.Z, X.Y   a release. Only a version tag produces these, and only after ci.yml has
#                        passed against that commit. This is what a hub in someone's house runs.
#   main, sha-<sha>      whatever main is at. For a hub being worked on (HUB_CHANNEL=main) and for
#                        looking at a build before tagging it. Never what a family gets.
name: brain image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["brain/**", "app/**", "sounds/**", ".github/workflows/brain-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Tags bypass branch protection, so a release is verified here before it is published. Pushes to
  # main skip this: they arrived through a protected branch and were verified on the way in.
  verify:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    # `always()` so a push to main, where verify is skipped rather than run, still builds.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/home-hub-brain
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: brain/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HUB_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            HUB_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
