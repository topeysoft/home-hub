; Brilliant OTA reachability probe.
;
; Broadcasts a proprietary-mesh DFU "State (Application)" offer with a version
; higher than the switches run, and listens for the target's DFU data-request
; packets (0xFFFB). Those requests -- emitted BEFORE any flash is written --
; prove the switch will accept a firmware transfer from us. No firmware is sent.
[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 6.11.0
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
board = esp32dev
upload_speed = 460800

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
