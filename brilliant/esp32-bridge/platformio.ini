; Brilliant mesh -> MQTT bridge.
;
; Swap boards by picking an environment:
;     pio run -e esp32dev -t upload
;     pio run -e esp32s3  -t upload
; or change default_envs below. Any board here needs BLE + WiFi; note that
; ESP32-S2 is deliberately absent because it has no Bluetooth radio at all.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
; BLE + WiFi + MQTT overflows the default partition table on every target -- and huge_app.csv, which
; used to be here, has ONE app slot, so an image built with it can never be updated over the air: OTA
; writes the other slot and flips otadata, and there is no other slot. min_spiffs.csv is the stock
; table with two 1.9 MB slots, which the ~1 MB image fits inside with room. The 16 MB S3 boards
; override it below with something roomier. See docs/puck-updates.md.
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
    ; NimBLE, not the Bluedroid-based BLE library that ships with the core:
    ; its writes and connects have timeouts, so a switch dropping the link
    ; mid-write cannot hang the main loop (which is what killed the MQTT
    ; session on weak links).
    h2zero/NimBLE-Arduino@^1.4.3

; ---- classic ESP32 (Xtensa, BT Classic + BLE) --------------------------------

; ESP32-D0WDQ6, 4MB flash. The right size for this job; the default.
[env:esp32dev]
platform = espressif32 @ 6.11.0
board = esp32dev
upload_speed = 460800

; Same silicon, common dev-board variants -- use whichever matches the pinout.
[env:lolin32]
platform = espressif32 @ 6.11.0
board = lolin32
upload_speed = 460800

[env:nodemcu-32s]
platform = espressif32 @ 6.11.0
board = nodemcu-32s
upload_speed = 460800

; WROVER module (extra PSRAM, otherwise identical for our purposes)
[env:esp32-wrover]
platform = espressif32 @ 6.11.0
board = esp32-wrover-kit
upload_speed = 460800

; ---- RISC-V parts (BLE only, no BT Classic -- fine, we only use BLE) --------

; Second puck. Its own header (include/secrets-s3.h) so it can sit on a different
; mesh network and MQTT base than the classic board. Serial goes over the S3's
; native USB port (the one labeled USB, not UART) -- that is where it shows up
; as /dev/cu.usbmodem*.
[env:esp32s3]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = partitions-ota.csv
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DSECRETS_FILE='"secrets-s3.h"'

[env:esp32c3]
platform = espressif32 @ 6.11.0
board = esp32-c3-devkitm-1
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

; ESP32-C6 needs the pioarduino platform fork (Arduino core 3.x).
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

; ---- what the hub ships ---------------------------------------------------------
; The same firmware with NO secrets header: it comes up blank and is written to
; over the cable (src/config.h). This is the image the hub flashes onto a bare
; board; the environments above are for pucks configured at a desk. The header
; name points at a file that does not exist on purpose -- include/secrets.h is
; still on this machine, and this build must not see it.
[env:esp32s3-ship]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = partitions-ota.csv
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DSECRETS_FILE='"no-secrets-in-a-shipped-image.h"'

; ---- the bench board ------------------------------------------------------------
; Not a puck anybody owns. This is the same firmware with src/errand_bench.h compiled
; in, to answer the one question design/ears/ rests on: whether this radio will hold a
; SECOND central GATT link -- to a strip that is knocking -- while the mesh proxy link
; stays up. It talks on its own MQTT base and its own discovery prefix so that nothing
; it says can land on a topic a house is reading. Never flash this onto a puck in a wall.
; NOTE THE FLASH SIZE. The two S3s on the strip bench carry 8 MB, not the 16 MB the
; puck boards have, so they take the stock min_spiffs.csv rather than partitions-ota.csv
; -- a 16 MB table on an 8 MB part boots into "Detected size(8192k) smaller than the
; size in the binary image header(16384k)" and reset-loops, which reads like a bad build.
[env:esp32s3-bench]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
; CDC OFF, unlike the puck environments: these boards are reached through the CH340
; UART port, and with the console on native USB the board runs and says nothing at all.
; MSYS1 IS THE POOL A SESSION EATS, AND THE STOCK 12 IS NOT ENOUGH. Inside an established
; protocomm session something is held per exchange and not returned, so a session fails
; with NimBLE rc=6 (BLE_HS_ENOMEM) at a count that scales with this number: 12 blocks dies
; around exchange 5, 40 around 12, 100 around 41. It is NOT a dropped link and must not be
; read as one, it needs a session (240 exchanges without one never did it), and the pool
; comes back when the link closes -- so this only has to cover one session. 100 is enough
; for an adoption where somebody presses the button promptly; it is not enough for the
; 170-round-trip press wait, which is what design/ears/ is deciding how to delete.
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
    -DSECRETS_FILE='"secrets-bench.h"' -DBENCH_ERRAND -DHA_PREFIX='"bench-ha"'
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=100
