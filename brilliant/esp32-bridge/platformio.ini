; Brilliant mesh -> MQTT bridge.
;
; Swap boards by picking an environment:
;     pio run -e esp32dev -t upload
;     pio run -e esp32s3  -t upload
; or change default_envs below. Any board here needs BLE + WiFi; note that
; ESP32-S2 is deliberately absent because it has no Bluetooth radio at all.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
; BLE + WiFi + MQTT overflows the default partition table on every target
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8

; ---- classic ESP32 (Xtensa, BT Classic + BLE) --------------------------------

; ESP32-D0WDQ6, 4MB flash. The right size for this job; the default.
[env:esp32dev]
platform = espressif32 @ 6.11.0
board = esp32dev
upload_speed = 460800

; Same silicon, common dev-board variants -- use whichever matches the pinout.
[env:lolin32]
platform = espressif32 @ 6.11.0
board = lolin32
upload_speed = 460800

[env:nodemcu-32s]
platform = espressif32 @ 6.11.0
board = nodemcu-32s
upload_speed = 460800

; WROVER module (extra PSRAM, otherwise identical for our purposes)
[env:esp32-wrover]
platform = espressif32 @ 6.11.0
board = esp32-wrover-kit
upload_speed = 460800

; ---- RISC-V parts (BLE only, no BT Classic -- fine, we only use BLE) --------

[env:esp32s3]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32c3]
platform = espressif32 @ 6.11.0
board = esp32-c3-devkitm-1
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

; ESP32-C6 needs the pioarduino platform fork (Arduino core 3.x).
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
