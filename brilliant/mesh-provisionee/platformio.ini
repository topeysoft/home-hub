; Mesh provisionee: pose as a fresh Brilliant switch so the live panel provisions
; us and hands over the network key. We capture the netkey, then can decrypt the
; panel's mesh traffic (PIR + tap-state for every switch) -- no reflash, no SWD.
[platformio]
default_envs = esp32dev
[env]
platform = espressif32 @ 6.11.0
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=1 -std=gnu++17
build_unflags = -std=gnu++11
[env:esp32dev]
board = esp32dev
upload_speed = 460800
[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 16MB
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
