  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing:antialiased;
      --ink:#f1eee8; --ink-2:#b9b5ad; --ink-3:#7f7d77; --rim:linear-gradient(158deg, rgba(255,255,255,.683), rgba(255,255,255,.08) 34%, rgba(14,14,22,.05) 62%, rgba(255,255,255,.393)); --drop:0 27px 61px -26px rgba(17,19,28,.666), 0 2px 10px rgba(17,19,28,.32); --inner:inset 0 -46px 56px -48px rgba(22,25,33,.9); }
    .gl { backdrop-filter: blur(26px) saturate(1.61) brightness(1.043); box-shadow: var(--inner), var(--drop); }
    .sf { box-shadow: inset 0 -40px 54px -48px rgba(30,20,50,.4), var(--drop); }
    .gl::after, .sf::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      padding:1.4px; background:var(--rim);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor;
      mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite:exclude; }
    .gl::before { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      background:linear-gradient(112deg, transparent 26%, rgba(255,255,255,.14) 45%, rgba(255,255,255,.02) 56%, transparent 64%); }
    .cap { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); line-height:1.7; }
    .tag { display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:999px;
      font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
      background:rgba(255,255,255,.16); color:rgba(255,255,255,.88); }
  </style>
</helmet>
