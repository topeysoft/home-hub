# Temporary driver layer on the Mac while the Pi ships. No radios, no host networking
# (Docker Desktop on macOS cannot do mDNS discovery). Devices are added by IP.
# The ./homeassistant config dir moves to the Pi unchanged.
#   docker compose -f docker-compose.mac.yml up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "8123:8123"
    volumes:
      - ./homeassistant:/config
    environment:
      - TZ=${TZ:-America/New_York}

  caddy:
    # HTTPS in front of the brain: https://<this mac>:8443. See caddy/Caddyfile for the trust step.
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "8088:8088"
    environment:
      - HUB_HTTP=http://localhost:8088, http://${HUB_IP:-192.168.86.59}:8088
      - HUB_HOSTS=https://localhost:8443, https://${HUB_IP:-192.168.86.59}:8443
      - BRAIN_UPSTREAM=host.docker.internal:8300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data

  ring-mqtt:
    # Ring Alarm and everything paired to its base station (Z-Wave locks, switches, plugs, contact and
    # motion sensors) via Ring's cloud, published to Mosquitto with HA discovery. First run: open
    # http://<host>:55123, sign in to Ring (with 2FA); the token is kept in ./ring-mqtt after that.
    image: tsightler/ring-mqtt
    container_name: ring-mqtt
    restart: unless-stopped
    depends_on: [mosquitto]
    ports:
      - "55123:55123"
    environment:
      - MQTTURL=mqtt://mosquitto:1883
      - ENABLEMODES=true
    volumes:
      - ./ring-mqtt:/data
