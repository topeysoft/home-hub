; A light strip controller: WS2812B and friends, and a Matter device in its own right.
;
;     pio run -e esp32s3 -t upload
;
; The data pin is a fact about the board on the desk rather than about this firmware, so it is
; overridable without editing anything:
;
;     PLATFORMIO_BUILD_FLAGS="-DDATA_PIN=21" pio run -e esp32s3 -t upload
;
; (`-t upload --project-option=...` is not a thing; that flag belongs to `pio project init`.)
; And when a strip stays dark, run `-e esp32s3-selftest` FIRST -- it drives the board's own LED and
; says in fifteen seconds whether the fault is in here or on the bench.
;
; TWO CHOICES HERE ARE THE ONES WE ONLY GET TO MAKE ONCE, so both are made before anything ships.
;
; THE PARTITION TABLE (partitions-matter.csv). An update writes the other app slot; it cannot move
; the slots. A unit that ships on a table too small for Matter can never become a Matter device, and
; the household would have to send it back.
;
; THE CORE. Matter on this silicon is esp-matter, and the Arduino wrapper for it arrived in core 3.x.
; The stock espressif32 platform is still on core 2.0.17, so this uses the pioarduino build -- the
; same fork brilliant/esp32-bridge already reaches for when it wants a C6. Moving later would mean
; reworking the RMT driver and the Bluetooth stack on a product that was already in houses.
;
; AND IT RETIRES A SECURITY HOLE RATHER THAN ADDING A FEATURE. The hand-rolled BLE provisioning this
; replaces sent the household's Wi-Fi password over an unauthenticated link. Matter commissioning is
; PASE with SPAKE2+ and then CASE: the credentials never cross in the clear, in a stack a great many
; people have looked at. That is the reason to do this now, ahead of the ecosystem support.
;
; WHICH PART. The S3 is the default: BLE 5.0 with better coexistence -- which matters because this
; streams frames AND holds a commissioning radio -- a more mature secure boot and flash encryption,
; native USB that takes the UART bridge chip off the board, and it is the same part as the bridge
; puck so one toolchain covers both. C6 and H2 would add Thread; nothing here needs it, and Matter
; over Wi-Fi is the right transport for something that will later carry frames.

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions-matter.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++2a
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
; No NimBLE. Matter owns the Bluetooth radio for commissioning, and a second BLE stack in the same
; image is both wasted flash and a second thing that can hold the radio when Matter wants it.

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
; PSRAM IS DELIBERATELY NOT TURNED ON HERE, and the reason is worth keeping. The frame buffer would
; rather live in PSRAM than in the same internal heap as Matter -- but the setting is per module, and
; the wrong one does not degrade, it stops the board booting. A WROOM-1 N8R8 or N16R8 wants
; `board_build.arduino.memory_type = qio_opi` and `-DBOARD_HAS_PSRAM`; an N8R2 wants `qio_qspi`; a
; module with no PSRAM wants neither. Nothing here can tell which is on the desk, so it is left to
; whoever knows. The driver asks for PSRAM first and falls back, so this only costs internal heap.
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

; Nothing attached, one light, four colors. The first thing to run when a strip stays dark, because
; it answers "is the driver wrong or is the bench wrong" in fifteen seconds. GPIO 48 is the onboard
; WS2812 on most S3 devkits; change it to whatever this board actually has.
[env:esp32s3-selftest]
extends = env:esp32s3
build_flags = ${env:esp32s3.build_flags} -DSELFTEST=1 -DDATA_PIN=48

[env:esp32c6]
; Thread as well as Wi-Fi, if a household ever wants this on a Thread border router instead.
board = esp32-c6-devkitc-1
upload_speed = 460800
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
