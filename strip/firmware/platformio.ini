; A light strip controller: WS2812B and friends, on the house's own Wi-Fi.
;
;     pio run -e esp32s3 -t upload
;
; Every board here needs BLE as well as Wi-Fi -- the strip is set up over Bluetooth and never on a
; cable (design/strip/), so an ESP32-S2 cannot do this job at all and is deliberately absent.
;
; WHICH PART TO SHIP, since all four of these build the same source: the S3 is the default and the
; reasons are about the product rather than the demo. BLE 5.0 with better coexistence, and the
; coexistence matters because this thing streams frames AND holds a recovery channel; a more mature
; secure boot and flash encryption, which is the difference between a household's Wi-Fi password
; being stored and being kept; and native USB, which takes the UART bridge chip off the board. It is
; also the same part as the bridge puck, so one toolchain and one update story cover both.
;
; A classic ESP32 does everything in the ambient product perfectly well and is a fine thing to
; prototype on. It is simply the oldest part in the family to start a multi-year product on.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
; Two OTA slots. The bridge puck shipped once with a single-slot table and could never be updated
; over the air afterwards -- the update writes the other slot, and there was no other slot.
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    knolleary/PubSubClient@^2.8
    ; NimBLE rather than the Bluedroid-based library: smaller, and its writes and connects have
    ; timeouts, so a link dropping mid-write cannot hang the loop that is also driving the strip.
    h2zero/NimBLE-Arduino@^1.4.3

[env:esp32s3]
platform = espressif32 @ 6.11.0
board = esp32-s3-devkitc-1
upload_speed = 921600
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

[env:esp32dev]
platform = espressif32 @ 6.11.0
board = esp32dev
upload_speed = 460800

[env:esp32c3]
platform = espressif32 @ 6.11.0
board = esp32-c3-devkitm-1
upload_speed = 460800
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0
